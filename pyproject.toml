[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telethon-floodgate"
version = "0.1.8"
description = "Flood-wait handling, proactive rate-limit gate and circuit breaker for Telethon user accounts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Axisrow"}]
requires-python = ">=3.11"
keywords = ["telegram", "telethon", "flood-wait", "rate-limit", "floodwait", "mtproto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "telethon>=1.36,<2",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/axisrow/telethon-floodgate"
Repository = "https://github.com/axisrow/telethon-floodgate"
Changelog = "https://github.com/axisrow/telethon-floodgate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "build>=1.2",
    "twine>=6.0",
]
# Opt-in live-test extra (tests_live/, never in CI): proxy support for
# REAL_TG_PROXY. Telethon needs python-socks for SOCKS/HTTP proxies and only
# warns (i.e. silently uses the direct route) when it is missing — the live
# harness fails loudly on that instead (#31).
live = [
    "python-socks[asyncio]>=2,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telethon_floodgate = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# tests_live/ is deliberately OUTSIDE testpaths: the default run and CI never
# collect live tests; they are invoked explicitly (pytest tests_live) and are
# additionally gated by RUN_FLOODGATE_LIVE_TG at runtime.
markers = [
    "live_tg_ro: opt-in read-only live Telegram test; gate: RUN_FLOODGATE_LIVE_TG=1",
    "live_tg_send: opt-in live Telegram test sending to Saved Messages only; gate: RUN_FLOODGATE_LIVE_TG=1",
]
filterwarnings = ["error"]
