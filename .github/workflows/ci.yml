name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests tests_live scripts
      - name: Build + twine check
        run: |
          python -m build
          python -m twine check dist/*

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Test jobs need only the pytest stack: build/twine/keyring/rich are
      # lint-job-only weight and cost ~2/3 of each job's Install step.
      - name: Install
        run: pip install -e . pytest pytest-asyncio pytest-timeout
      - name: Pytest
        run: python -m pytest -q

  telethon-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        telethon: ["1.36.0", "1.43.2", "1.45.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install supported Telethon
        run: pip install -e . pytest pytest-asyncio pytest-timeout "Telethon==${{ matrix.telethon }}"
      - name: Offline sender-boundary contracts
        run: python -m pytest tests/test_rpc_gate.py -q
